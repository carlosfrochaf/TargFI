<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="agBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="agAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#agBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#334155" stroke-width="1.5" />

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="48" rx="16" fill="#1E293B" />
  <circle cx="28" cy="24" r="6" fill="#EF4444" />
  <circle cx="48" cy="24" r="6" fill="#F59E0B" />
  <circle cx="68" cy="24" r="6" fill="#10B981" />
  <text x="100" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Agenda Aí — Gestão de Agendamentos &amp; Notificações Inteligentes</text>
  <rect x="655" y="14" width="115" height="22" rx="11" fill="#10B981" fill-opacity="0.2" />
  <text x="672" y="29" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34D399">● Sincronizado</text>

  <!-- Left: Mini Calendar + Metrics -->
  <g transform="translate(24, 70)">
    <rect x="0" y="0" width="240" height="400" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="18" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Outubro 2026</text>
    
    <!-- Days header -->
    <text x="18" y="65" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">D   S   T   Q   Q   S   S</text>
    
    <!-- Calendar grid representation -->
    <g transform="translate(18, 85)" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">
      <text x="0" y="0">      1   2   3   4   5</text>
      <text x="0" y="24">  6   7   8   9  10  11  12</text>
      <text x="0" y="48"> 13</text>
      <circle cx="48" cy="44" r="12" fill="#06B6D4" />
      <text x="42" y="48" fill="#FFFFFF" font-weight="700">14</text>
      <text x="64" y="48"> 15  16  17  18  19</text>
      <text x="0" y="72"> 20  21  22  23  24  25  26</text>
      <text x="0" y="96"> 27  28  29  30  31</text>
    </g>

    <!-- Mini Stats -->
    <line x1="16" y1="210" x2="224" y2="210" stroke="#334155" />
    <text x="18" y="235" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Hoje (14 de Outubro)</text>
    
    <rect x="18" y="250" width="204" height="60" rx="8" fill="#0F172A" />
    <text x="30" y="274" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Agendamentos Marcados</text>
    <text x="30" y="298" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#34D399">12 Horários</text>

    <rect x="18" y="322" width="204" height="60" rx="8" fill="#0F172A" />
    <text x="30" y="344" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Lembretes WhatsApp</text>
    <text x="30" y="368" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38BDF8">100% Entregues</text>
  </g>

  <!-- Right: Day Schedule & Slots -->
  <g transform="translate(285, 70)">
    <rect x="0" y="0" width="485" height="400" rx="12" fill="#1E293B" stroke="#334155" />
    
    <text x="20" y="34" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Grade de Atendimento — Quarta-feira</text>
    <rect x="375" y="16" width="95" height="28" rx="6" fill="url(#agAccent)" />
    <text x="388" y="34" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0F172A">+ Agendar</text>

    <line x1="0" y1="58" x2="485" y2="58" stroke="#334155" />

    <!-- Slot 1 -->
    <text x="20" y="94" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">09:00</text>
    <rect x="68" y="74" width="395" height="48" rx="8" fill="#0F172A" stroke="#34D399" stroke-width="1.2" />
    <text x="82" y="95" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Dra. Rosângela — Consulta Inicial</text>
    <text x="82" y="112" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">Cliente: Marcos Vinícius • Presencial</text>
    <rect x="360" y="86" width="90" height="22" rx="11" fill="#10B981" fill-opacity="0.2" />
    <text x="372" y="101" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#34D399">Confirmado</text>

    <!-- Slot 2 -->
    <text x="20" y="160" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">11:30</text>
    <rect x="68" y="140" width="395" height="48" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
    <text x="82" y="161" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Reunião Alinhamento Proposta Comercial</text>
    <text x="82" y="178" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">Google Meet • Link enviado</text>
    <rect x="360" y="152" width="90" height="22" rx="11" fill="#0284C7" fill-opacity="0.2" />
    <text x="380" y="167" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#38BDF8">Online</text>

    <!-- Slot 3 -->
    <text x="20" y="226" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">14:00</text>
    <rect x="68" y="206" width="395" height="48" rx="8" fill="#0F172A" stroke="#A855F7" stroke-width="1.2" />
    <text x="82" y="227" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Demonstração Sistema Dashboard</text>
    <text x="82" y="244" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">Cliente: Diretor Financeiro TARGFI</text>
    <rect x="360" y="218" width="90" height="22" rx="11" fill="#7C3AED" fill-opacity="0.2" />
    <text x="375" y="233" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#C084FC">Ao Vivo</text>

    <!-- Slot 4 -->
    <text x="20" y="292" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">16:30</text>
    <rect x="68" y="272" width="395" height="48" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2" />
    <text x="82" y="293" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Atendimento Jurídico Trabalhista</text>
    <text x="82" y="310" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">Aguardando confirmação do cliente</text>
    <rect x="360" y="284" width="90" height="22" rx="11" fill="#D97706" fill-opacity="0.2" />
    <text x="376" y="299" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#FBBF24">Pendente</text>

    <!-- Slot 5 -->
    <text x="20" y="358" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">18:00</text>
    <rect x="68" y="338" width="395" height="42" rx="8" fill="#0F172A" stroke="#334155" stroke-dasharray="4 4" />
    <text x="82" y="364" font-family="system-ui, sans-serif" font-size="11.5" fill="#64748B">+ Horário Livre para Reserva Online</text>
  </g>
</svg>
