<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="targfiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Symbol -->
  <g transform="translate(10, 10)">
    <!-- Hex / Tech Backing -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#0F172A" stroke="url(#targfiGrad)" stroke-width="2" />
    
    <!-- Abstract T & Target Nodes -->
    <path d="M18 20 H42 M30 20 V46" stroke="url(#targfiGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="30" cy="46" r="3.5" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="18" cy="20" r="3" fill="#A855F7" />
    <circle cx="42" cy="20" r="3" fill="#38BDF8" />

    <!-- Modern accent crosshair / flow line -->
    <path d="M22 33 L38 33" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="82" y="46" font-family="'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
    TARG<tspan fill="url(#targfiGrad)">FI</tspan>
  </text>
  
  <text x="84" y="62" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="3" fill="#94A3B8">
    SISTEMAS &amp; TECNOLOGIA
  </text>
</svg>
