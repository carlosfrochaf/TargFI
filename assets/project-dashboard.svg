<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#dashBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#1F2937" stroke-width="1.5" />

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="48" rx="16" fill="#111827" />
  <circle cx="28" cy="24" r="6" fill="#EF4444" />
  <circle cx="48" cy="24" r="6" fill="#F59E0B" />
  <circle cx="68" cy="24" r="6" fill="#10B981" />
  <text x="100" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">TARGFI Analytics — Painel Executivo de Gestão em Tempo Real</text>
  <rect x="670" y="12" width="100" height="24" rx="6" fill="#0284C7" fill-opacity="0.2" />
  <text x="682" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Exportar Excel</text>

  <!-- Metric KPI Cards -->
  <g transform="translate(24, 66)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="175" height="82" rx="10" fill="#1F2937" stroke="#374151" />
    <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9CA3AF">FATURAMENTO MÊS</text>
    <text x="16" y="56" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">R$ 148.920</text>
    <text x="16" y="74" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#34D399">▲ +24.8% vs mês ant.</text>

    <!-- KPI 2 -->
    <rect x="192" y="0" width="175" height="82" rx="10" fill="#1F2937" stroke="#374151" />
    <text x="208" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9CA3AF">PROCESSOS ATIVOS</text>
    <text x="208" y="56" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#38BDF8">486</text>
    <text x="208" y="74" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#38BDF8">● 98% no prazo legal</text>

    <!-- KPI 3 -->
    <rect x="384" y="0" width="175" height="82" rx="10" fill="#1F2937" stroke="#374151" />
    <text x="400" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9CA3AF">LEADS CONVERTIDOS</text>
    <text x="400" y="56" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#A855F7">74 Clientes</text>
    <text x="400" y="74" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#C084FC">Taxa conv. 14.2%</text>

    <!-- KPI 4 -->
    <rect x="576" y="0" width="175" height="82" rx="10" fill="#1F2937" stroke="#374151" />
    <text x="592" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9CA3AF">TEMPO ECONOMIZADO</text>
    <text x="592" y="56" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#F59E0B">38h / sem</text>
    <text x="592" y="74" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#FBBF24">Automação ativa</text>
  </g>

  <!-- Big Chart Area -->
  <g transform="translate(24, 166)">
    <rect x="0" y="0" width="500" height="305" rx="12" fill="#1F2937" stroke="#374151" />
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Evolução de Desempenho &amp; Volume Operacional</text>
    <text x="20" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#9CA3AF">Dados integrados em tempo real via API TARGFI</text>

    <!-- Chart Grid Lines -->
    <line x1="20" y1="90" x2="480" y2="90" stroke="#374151" stroke-dasharray="3 3" />
    <line x1="20" y1="140" x2="480" y2="140" stroke="#374151" stroke-dasharray="3 3" />
    <line x1="20" y1="190" x2="480" y2="190" stroke="#374151" stroke-dasharray="3 3" />
    <line x1="20" y1="240" x2="480" y2="240" stroke="#374151" />

    <!-- Wave Area Filled -->
    <path d="M30 220 Q 90 190, 150 160 T 270 120 T 380 95 T 470 70 L 470 240 L 30 240 Z" fill="url(#chartGrad)" />
    <!-- Wave Stroke -->
    <path d="M30 220 Q 90 190, 150 160 T 270 120 T 380 95 T 470 70" stroke="#38BDF8" stroke-width="3.5" fill="none" stroke-linecap="round" />

    <!-- Data Points -->
    <circle cx="150" cy="160" r="4.5" fill="#38BDF8" />
    <circle cx="270" cy="120" r="4.5" fill="#38BDF8" />
    <circle cx="380" cy="95" r="4.5" fill="#38BDF8" />
    <circle cx="470" cy="70" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />

    <!-- X labels -->
    <text x="25" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">Seg</text>
    <text x="100" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">Ter</text>
    <text x="175" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">Qua</text>
    <text x="250" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">Qui</text>
    <text x="325" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">Sex</text>
    <text x="400" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">Sáb</text>
    <text x="455" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">Dom</text>
  </g>

  <!-- Donut / Distribution Card -->
  <g transform="translate(540, 166)">
    <rect x="0" y="0" width="235" height="305" rx="12" fill="#1F2937" stroke="#374151" />
    <text x="18" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Canais de Entrada</text>
    <text x="18" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#9CA3AF">Origem das demandas</text>

    <!-- Donut Chart Circle representation -->
    <circle cx="117" cy="125" r="54" stroke="#374151" stroke-width="20" fill="none" />
    <circle cx="117" cy="125" r="54" stroke="#38BDF8" stroke-width="20" stroke-dasharray="190 340" stroke-linecap="round" fill="none" transform="rotate(-90 117 125)" />
    <circle cx="117" cy="125" r="54" stroke="#A855F7" stroke-width="20" stroke-dasharray="90 340" stroke-dashoffset="-190" stroke-linecap="round" fill="none" transform="rotate(-90 117 125)" />
    <circle cx="117" cy="125" r="54" stroke="#10B981" stroke-width="20" stroke-dasharray="50 340" stroke-dashoffset="-280" stroke-linecap="round" fill="none" transform="rotate(-90 117 125)" />
    
    <text x="117" y="123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">100%</text>
    <text x="117" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#9CA3AF">Mapeado</text>

    <!-- Legend -->
    <g transform="translate(18, 205)" font-family="system-ui, sans-serif" font-size="11">
      <circle cx="6" cy="6" r="4" fill="#38BDF8" />
      <text x="18" y="10" fill="#E5E7EB">Bots &amp; Automação (55%)</text>

      <circle cx="6" cy="30" r="4" fill="#A855F7" />
      <text x="18" y="34" fill="#E5E7EB">Landing Pages (28%)</text>

      <circle cx="6" cy="54" r="4" fill="#10B981" />
      <text x="18" y="58" fill="#E5E7EB">Sistemas &amp; Fichas (17%)</text>
    </g>
  </g>
</svg>
